<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="IBM Plex Sans, Arial, Helvetica, sans-serif">
  <title>Recorrido de la ronda nocturna: plano esquemático de planta baja y primer piso</title>
  <desc>Plano esquemático sin escala. Ruta Ronda completa: base en garita (PB), ocho puntos de control en dos pisos, escalera E de subida y escalera O de bajada, salidas de emergencia y punto seguro alternativo.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B86E00"/>
    </marker>
    <pattern id="escalon" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 H8" stroke="#1C1B17" stroke-width="1"/>
    </pattern>
    <pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0,0 V8" stroke="#8A8472" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="800" fill="#F4F0E6"/>
  <text x="40" y="34" font-size="22" font-weight="700" fill="#1C1B17" letter-spacing="1">RONDA NOCTURNA · RECORRIDO "RONDA COMPLETA"</text>
  <text x="40" y="54" font-size="13" fill="#4A463B">Plano esquemático sin escala · Edificio universitario de 2 pisos (PB y 1°) · 8 puntos de control (PC)</text>

  <!-- Conexiones entre pisos -->
  <path d="M610,150 V108 H1290 V148" fill="none" stroke="#B86E00" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#flecha)"/>
  <text x="1010" y="102" font-size="12" fill="#1C1B17" text-anchor="middle">SUBIDA por escalera E (PC3)</text>
  <path d="M790,143 V84 H110 V148" fill="none" stroke="#B86E00" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#flecha)"/>
  <text x="330" y="78" font-size="12" fill="#1C1B17" text-anchor="middle">BAJADA por escalera O (PC8)</text>

  <!-- ===== PLANTA BAJA ===== -->
  <text x="40" y="124" font-size="15" font-weight="700" fill="#1C1B17" letter-spacing="2">PLANTA BAJA (PB)</text>
  <rect x="40" y="150" width="640" height="450" fill="#FBF9F3" stroke="#1C1B17" stroke-width="3"/>

  <!-- pasillo -->
  <rect x="60" y="330" width="600" height="60" fill="#E9E3D3" stroke="#1C1B17" stroke-width="1.5"/>
  <text x="400" y="352" font-size="11" fill="#4A463B" text-anchor="middle" letter-spacing="1">PASILLO PB</text>
  <!-- escaleras -->
  <rect x="560" y="150" width="100" height="150" fill="url(#escalon)" stroke="#1C1B17" stroke-width="1.5"/>
  <text x="610" y="200" font-size="12" font-weight="700" fill="#1C1B17" text-anchor="middle" paint-order="stroke" stroke="#FBF9F3" stroke-width="4">ESCALERA E</text>
  <rect x="60" y="150" width="100" height="150" fill="url(#escalon)" stroke="#1C1B17" stroke-width="1.5"/>
  <text x="110" y="200" font-size="12" font-weight="700" fill="#1C1B17" text-anchor="middle" paint-order="stroke" stroke="#FBF9F3" stroke-width="4">ESCALERA O</text>
  <!-- hall -->
  <rect x="180" y="390" width="240" height="210" fill="#EFEADB" stroke="#1C1B17" stroke-width="1.5"/>
  <text x="300" y="578" font-size="11" fill="#4A463B" text-anchor="middle" letter-spacing="1">HALL PB</text>
  <rect x="268" y="596" width="64" height="8" fill="#FBF9F3"/>
  <text x="300" y="622" font-size="11" fill="#4A463B" text-anchor="middle">Acceso principal</text>
  <!-- garita -->
  <rect x="60" y="480" width="110" height="120" fill="#EFEADB" stroke="#1C1B17" stroke-width="2"/>
  <rect x="95" y="476" width="30" height="8" fill="#FBF9F3"/>
  <text x="115" y="582" font-size="11" fill="#1C1B17" text-anchor="middle" font-weight="700">GARITA</text>
  <rect x="97" y="522" width="36" height="36" fill="#1C1B17"/>
  <path d="M117,528 L108,543 H115 L113,552 L124,536 H117 Z" fill="#F2A900"/>
  <text x="115" y="514" font-size="11" fill="#1C1B17" text-anchor="middle" font-weight="700">BASE</text>
  <!-- salida emergencia PB -->
  <rect x="668" y="346" width="28" height="28" fill="#2E7D4F" stroke="#1C1B17" stroke-width="1"/>
  <path d="M674,360 H688 M683,354 L689,360 L683,366" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text x="660" y="412" font-size="11" fill="#1C1B17" text-anchor="end">Salida de emergencia PB</text>
  <!-- punto seguro alternativo -->
  <path d="M610,245 l11,11 l-11,11 l-11,-11 z" fill="#FBF9F3" stroke="#1C1B17" stroke-width="2"/>
  <text x="647" y="246" font-size="10.5" fill="#1C1B17" paint-order="stroke" stroke="#FBF9F3" stroke-width="3">Descanso</text>
  <text x="647" y="259" font-size="10.5" fill="#1C1B17" paint-order="stroke" stroke="#FBF9F3" stroke-width="3">esc. E (PS alt.)</text>

  <!-- ruta PB (salida: BASE -> PC1 -> PC2 -> PC3) -->
  <path d="M133,545 H300 V500 M300,500 V360 H610 V318" fill="none" stroke="#B86E00" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#flecha)"/>
  <!-- ruta PB (retorno: bajada O -> BASE) -->
  <path d="M110,300 V510" fill="none" stroke="#B86E00" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#flecha)"/>
  <text x="104" y="420" font-size="11" fill="#B86E00" text-anchor="end" font-weight="700">regreso</text>

  <g font-size="13" font-weight="700" text-anchor="middle" fill="#fff">
    <circle cx="300" cy="500" r="14" fill="#1C1B17"/><text x="300" y="505">1</text>
    <circle cx="560" cy="360" r="14" fill="#1C1B17"/><text x="560" y="365">2</text>
    <circle cx="610" cy="305" r="14" fill="#1C1B17"/><text x="610" y="310">3</text>
  </g>

  <!-- ===== PRIMER PISO ===== -->
  <text x="720" y="124" font-size="15" font-weight="700" fill="#1C1B17" letter-spacing="2">PRIMER PISO (1°)</text>
  <rect x="720" y="150" width="640" height="450" fill="#FBF9F3" stroke="#1C1B17" stroke-width="3"/>

  <rect x="740" y="330" width="600" height="60" fill="#E9E3D3" stroke="#1C1B17" stroke-width="1.5"/>
  <text x="1060" y="348" font-size="11" fill="#4A463B" text-anchor="middle" letter-spacing="1">PASILLO 1°A</text>
  <rect x="750" y="200" width="80" height="130" fill="#E9E3D3" stroke="#1C1B17" stroke-width="1.5"/>
  <text x="840" y="300" font-size="11" fill="#4A463B" letter-spacing="1">PASILLO 1°B</text>
  <rect x="740" y="150" width="100" height="50" fill="url(#escalon)" stroke="#1C1B17" stroke-width="1.5"/>
  <text x="790" y="180" font-size="11" font-weight="700" fill="#1C1B17" text-anchor="middle" paint-order="stroke" stroke="#FBF9F3" stroke-width="4">ESC. O</text>
  <rect x="1240" y="150" width="100" height="150" fill="url(#escalon)" stroke="#1C1B17" stroke-width="1.5"/>
  <text x="1290" y="200" font-size="12" font-weight="700" fill="#1C1B17" text-anchor="middle" paint-order="stroke" stroke="#FBF9F3" stroke-width="4">ESCALERA E</text>
  <!-- sala técnica -->
  <rect x="880" y="390" width="160" height="140" fill="url(#rayado)" stroke="#1C1B17" stroke-width="2"/>
  <rect x="940" y="386" width="40" height="8" fill="#E9E3D3"/>
  <rect x="898" y="496" width="124" height="26" fill="#FBF9F3" stroke="#1C1B17" stroke-width="1"/>
  <text x="960" y="513" font-size="11" font-weight="700" fill="#1C1B17" text-anchor="middle">SALA TÉCNICA</text>
  <!-- sensor de temperatura -->
  <rect x="1000" y="410" width="30" height="18" fill="#FBF9F3" stroke="#1C1B17" stroke-width="1"/>
  <text x="1015" y="423" font-size="11" font-weight="700" fill="#1C1B17" text-anchor="middle">T°C</text>
  <!-- salida emergencia 1° -->
  <rect x="706" y="346" width="28" height="28" fill="#2E7D4F" stroke="#1C1B17" stroke-width="1"/>
  <path d="M728,360 H714 M719,354 L713,360 L719,366" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text x="745" y="412" font-size="11" fill="#1C1B17">Salida de emergencia 1°</text>

  <!-- ruta 1° -->
  <path d="M1290,300 V360 H1195 M1165,360 H955 V450 M965,450 V360 H790 V318 M790,270 V212" fill="none" stroke="#B86E00" stroke-width="3" stroke-dasharray="9 5"/>
  <path d="M790,282 V212" fill="none" stroke="#B86E00" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#flecha)"/>
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#fff">
    <circle cx="1180" cy="360" r="14" fill="#1C1B17"/><text x="1180" y="365">4</text>
    <circle cx="960" cy="450" r="14" fill="#1C1B17"/><text x="960" y="455">5</text>
    <circle cx="790" cy="360" r="14" fill="#1C1B17"/><text x="790" y="365">6</text>
    <circle cx="790" cy="270" r="14" fill="#1C1B17"/><text x="790" y="275">7</text>
    <circle cx="790" cy="215" r="14" fill="#1C1B17"/><text x="790" y="220">8</text>
  </g>
  <circle cx="1290" cy="300" r="5" fill="#B86E00"/>
  <text x="1280" y="322" font-size="10.5" fill="#1C1B17" text-anchor="end">llegada de PB</text>

  <!-- ===== LEYENDA ===== -->
  <line x1="40" y1="650" x2="1360" y2="650" stroke="#1C1B17" stroke-width="1"/>
  <text x="40" y="674" font-size="13" font-weight="700" fill="#1C1B17" letter-spacing="2">REFERENCIAS</text>

  <g font-size="12" fill="#1C1B17">
    <circle cx="54" cy="696" r="11" fill="#1C1B17"/><text x="54" y="700" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">n</text>
    <text x="76" y="700">Punto de control (PC) numerado según el orden de la ronda</text>

    <rect x="43" y="716" width="22" height="22" fill="#1C1B17"/><path d="M56,720 L48,730 H54 L52,736 L61,726 H56 Z" fill="#F2A900"/>
    <text x="76" y="732">Base de carga y punto seguro principal (garita, PB)</text>

    <path d="M54,748 l9,9 l-9,9 l-9,-9 z" fill="#FBF9F3" stroke="#1C1B17" stroke-width="2"/>
    <text x="76" y="762">Punto seguro alternativo: descanso de la escalera E</text>

    <rect x="440" y="685" width="22" height="22" fill="#2E7D4F"/><path d="M445,696 H457 M453,691 L458,696 L453,701" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="472" y="701">Salida de emergencia (PC2 y PC6)</text>

    <rect x="440" y="716" width="22" height="22" fill="url(#escalon)" stroke="#1C1B17"/>
    <text x="472" y="732">Escalera (PC3 sube por E, PC8 baja por O)</text>

    <path d="M440,756 H462" stroke="#B86E00" stroke-width="3" stroke-dasharray="9 5"/>
    <text x="472" y="760">Ruta del robot (sentido indicado por las flechas)</text>
  </g>

  <g font-size="12" fill="#1C1B17">
    <text x="860" y="674" font-size="13" font-weight="700" letter-spacing="2">PUNTOS DE CONTROL</text>
    <text x="860" y="696">PC1  Hall PB</text>
    <text x="860" y="714">PC2  Salida de emergencia PB (LiDAR + cámara)</text>
    <text x="860" y="732">PC3  Escalera E (subida)</text>
    <text x="860" y="750">PC4  Pasillo 1°A</text>
    <text x="1120" y="696">PC5  Sala técnica 1° (temperatura)</text>
    <text x="1120" y="714">PC6  Salida de emergencia 1° (LiDAR + cámara)</text>
    <text x="1120" y="732">PC7  Pasillo 1°B</text>
    <text x="1120" y="750">PC8  Escalera O (bajada), luego regreso a BASE</text>
  </g>
  <text x="40" y="788" font-size="11" fill="#4A463B">Esquema ilustrativo del caso de estudio: no representa el relevamiento de un edificio real. La altura de los escalones debe medirse antes de operar (el Go2 declara 16 cm como máximo).</text>
</svg>
